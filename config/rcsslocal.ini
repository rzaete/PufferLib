[base]
env_name = rcsslocal
checkpoint_interval=200

; Historical selfplay pool: LEFT=primary, RIGHT=frozen on tagged envs.
; Hist spawn: near RIGHT goal only (primary attacks), no alternating — so
; winrate can leave 0.5 when primary finishes better than frozen defends.
; Prefer winrate-driven pool growth; interval is a slow backup.
[selfplay]
enabled = 1
max_size = 16
swap_winrate = 0.55
min_games = 1024
snapshot_interval = 500_000_000
opp_timeout_steps = 400_000_000

[vec]
; Wider vectorization amortizes stadium step cost and fills the GPU better.
; ~3072 is the sweet spot on Ryzen 5900X + RTX 4070; 3584 can peak higher
; but is noisier. Do not push num_threads past ~18 (SMT oversubscription hurts).
total_agents = 3072
num_buffers = 2
num_threads = 18
; Fraction of buffer slots for frozen bank (team_size-aligned; 2v2 team_size=2).
; Lower than 0.25 so pure full-pitch selfplay (demo conditions) dominates
; gradients; hist still provides ladder pressure.
num_frozen_banks = 1
frozen_bank_pct = 0.10

[policy]
hidden_size = 128
; num_layers = 2

[env]
; Roster: agents [0, num_left)=LEFT (t1), [num_left, num_left+num_right)=RIGHT (t2).
; 2v2 competitive self-play (shared policy; zero-sum goals).
; Equal sides required for selfplay pool (team_size = num_agents / 2).
; total_agents must be divisible by num_agents (4).
num_left = 2
num_right = 2
synch_mode = 1
use_monitor = 0
; Full-pitch room to find ball + finish; was often timing out at 300.
max_episode_tick = 400
; fixed_horizon = 1 → always 3000 ticks, step_penalty forced off, no early
; terminal (goals/OOB reward then soft-respawn). Default is sparse episodes.
fixed_horizon = 0
; Make scoring dominate: previous run mean return stayed ~-1 despite ~50% goals.
step_penalty = 0.001
goal_reward = 5
timeout_penalty = 0.25
oob_penalty = 0.5

; Pure full-pitch selfplay: discovery comes from empty-net warm-start, not
; spawn shrink. curriculum_rate=0 freezes progress at spawn_progress=1.
spawn_progress = 1.0
curriculum_rate = 0
curriculum_alpha = 0.02
curriculum_target = 0.50
; With progress pinned at 1, all pure-SP episodes are eval-like.
eval_spawn_min = 0.95

[train]
; Longer rollouts + larger minibatches cut train overhead per step.
; Constraints: minibatch_size % horizon == 0, minibatch_size <= horizon * total_agents
horizon = 256
total_timesteps = 20_000_000_000
; Slightly cooler than default 0.015 — last run KL spiked late (0.01→0.10).
learning_rate = 0.01
; Floor LR so cosine anneal does not kill updates late (default min_lr_ratio=0).
min_lr_ratio = 0.1
; Keep exploration; last run entropy collapsed 10.7→5.1.
ent_coef = 0.005
gamma = 0.995
minibatch_size = 32768
replay_ratio = 1.0

; --- 1-GPU / ~4h hyperparameter sweep -----------------------------------------
; Your box does ~100M steps in ~50s, so ~4h is plenty for ~80 short trials.
; Keep vec/total_agents and minibatch_size fixed (already tuned for 4070).
; Horizon range stays legal: horizon * 3072 >= 32768, and for pow2 horizons
; in [64, 512] we also have 32768 % horizon == 0.
[sweep]
gpus = 1
max_runs = 80
; Kill a trial if wall-clock exceeds this (seconds). Normal trials finish in ~1 min.
max_suggestion_cost = 300
; Fewer dims → denser GP coverage in a short campaign.
sweep_only = total_timesteps,learning_rate,ent_coef,gamma,gae_lambda,horizon,replay_ratio,hidden_size

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e8
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.03
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto
