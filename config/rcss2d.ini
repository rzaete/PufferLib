[base]
env_name = rcss2d

[vec]
# RCSS2D is heavy (1 server + ~10 child processes + 2 UDP clients per match).
# Start tiny for smoke testing / debugging the hybrid client integration.
total_agents = 4
num_buffers = 1
num_threads = 4   # no point in many threads for 2 agents

[train]
# For tiny vectorization (2 agents), keep rollout data small.
# minibatch_size must be <= horizon * total_agents and divisible by horizon.
horizon = 64
minibatch_size = 128
total_timesteps = 1_000_000   # reduced for debug/smoke; increase for real runs
gamma = 0.99
learning_rate = 0.015
ent_coef = 0.02

[env]
# Optional: set use_monitor=1 to spawn rcssmonitor children (useful for --local debugging only)
use_monitor = 1.0

