[base]
env_name = rcssemptynet
checkpoint_interval=200

[selfplay]
enabled = 0

[vec]
; Wider vectorization amortizes stadium step cost and fills the GPU better.
; ~3072 is the sweet spot on Ryzen 5900X + RTX 4070; 3584 can peak higher
; but is noisier. Do not push num_threads past ~18 (SMT oversubscription hurts).
; total_agents must be divisible by num_players (2 for default).
total_agents = 3072
num_buffers = 2
num_threads = 18

[policy]
hidden_size = 128
num_layers = 4

[env]
; One-sided empty net: (1=LEFT, -1=RIGHT).
side = 1
early_terminal = 1
starting_horizon_ticks = 150
step_reward = -0.002
goal_reward = 10
fault_reward = -1
no_goal_timeout = 250
no_goal_reward = -5

difficulty = 0
success_update_rate = 0.02
target_success_rate = 0.70
difficulty_rate = 0.1

[train]
; Longer rollouts + larger minibatches cut train overhead per step.
; Constraints: minibatch_size % horizon == 0, minibatch_size <= horizon * total_agents
horizon = 256
total_timesteps = 200_000_000
learning_rate = 0.01
min_lr_ratio = 0.1
ent_coef = 0.005
gamma = 0.995
minibatch_size = 8192

[sweep.env.starting_horizon_ticks]
distribution = int_uniform
min = 50
max = 400
scale = auto

[sweep.env.step_reward]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.env.goal_reward]
distribution = uniform
min = 0.0
max = 10.0
scale = auto

[sweep.env.fault_reward]
distribution = uniform
min = -10.0
max = 0.0
scale = auto

[sweep.env.no_goal_reward]
distribution = uniform
min = -10.0
max = 0.0
scale = auto

[sweep.env.difficulty]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.success_update_rate]
distribution = log_normal
min = 0.005
max = 0.1
scale = auto

[sweep.env.target_success_rate]
distribution = logit_normal
min = 0.4
max = 0.95
scale = auto

[sweep.env.difficulty_rate]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 18
num_policies = 1
hist_policy_hidden_size = 0
hist_policy_num_layers = 0
hist_policy_percent = 0

[selfplay]
enabled = 0
max_size = 16
seed = 42
opp_timeout_steps = 500000000
eval_pool_size = 8
eval_games = 0

[env]
